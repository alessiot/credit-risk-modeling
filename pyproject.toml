[project]
name = "credit-risk"
version = "0.1.0"
description = "12-month probability-of-default model at loan origination, with an out-of-time evaluation and a Metaflow pipeline."
requires-python = ">=3.12"
dependencies = [
    "joblib>=1.6.0",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.2",
    "metaflow>=2.19.41",
    "numpy>=2.5.5",
    "optuna>=5.1.0",
    "pandas>=3.1.1",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-include = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N", "ANN", "D", "T20", "LOG", "G"]
ignore = ["D100", "D104", "N803", "N806"]  # N803/N806: sklearn names the feature matrix X

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "ANN", "T20"]
"notebooks/**" = ["D", "ANN", "T20", "E402", "N816"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]
markers = ["slow: long-running tests, skipped by scripts/check.sh unless --full"]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupytext>=1.19.6",
    "nbconvert>=7.17.2",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
